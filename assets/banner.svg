<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Sumukh, Full-Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#14203d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="type">
      <rect x="70" y="168" height="50" width="0">
        <animate attributeName="width" values="0;470;470;0" keyTimes="0;.35;.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace}
    .sans{font-family:'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .float{animation:float 6s ease-in-out infinite}
    .f2{animation-delay:-2s}.f3{animation-delay:-4s}
    @keyframes float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-14px);opacity:.75}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.float,.pulse{animation:none}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect x="-300" y="0" width="300" height="300" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1500 0" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- right side: rotating ring + code mark -->
    <circle cx="1000" cy="150" r="92" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 14" opacity=".7">
      <animateTransform attributeName="transform" type="rotate" from="0 1000 150" to="360 1000 150" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="150" r="62" fill="none" stroke="#38bdf8" stroke-opacity=".35"/>
    <text x="1000" y="168" text-anchor="middle" class="mono" font-size="46" font-weight="700" fill="url(#accent)">&lt;/&gt;</text>

    <text x="880" y="80" class="mono float" font-size="26" fill="#38bdf8">{ }</text>
    <text x="1110" y="96" class="mono float f2" font-size="26" fill="#a78bfa">=&gt;</text>
    <text x="900" y="250" class="mono float f3" font-size="26" fill="#a78bfa">;</text>
    <text x="1085" y="248" class="mono float f2" font-size="26" fill="#38bdf8">( )</text>

    <!-- left side: text -->
    <text x="70" y="62" class="mono" font-size="20" fill="#64748b">// hello, world</text>
    <text x="70" y="140" class="sans" font-size="82" font-weight="800" fill="url(#accent)">Sumukh</text>
    <g clip-path="url(#type)">
      <text x="70" y="205" class="mono" font-size="30" fill="#e6edf3">&gt; Full-Stack Developer</text>
    </g>
    <rect y="176" width="3" height="34" fill="#38bdf8">
      <animate attributeName="x" values="70;540;540;70" keyTimes="0;.35;.9;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="70" y="262" class="mono" font-size="16" fill="#94a3b8">Bengaluru  |  MCA @ RVCE  |  JavaScript, Firebase, Python, SQL</text>

    <rect x="0" y="294" width="1200" height="6" fill="url(#accent)" class="pulse"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
