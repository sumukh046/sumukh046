<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Terminal card: whoami, stack, currently learning</title>
  <style>
    .m{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace;font-size:18px}
    .p{fill:#34d399}.c{fill:#e6edf3}.o{fill:#7dd3fc}.v{fill:#c4b5fd}.d{fill:#64748b;font-size:14px}
    .cur{animation:blink 1s steps(1) infinite}
